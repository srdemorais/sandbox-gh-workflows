name: Hello World workflow

on: [workflow_dispatch]

jobs:
  hello_world_from_ubuntu_shell:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello World from Ubuntu"
  hello_world_from_python_shell:
    runs-on: ubuntu-latest
    steps:
      - run: print("Hello World from Python")
        shell: python
  hello_world_from_gh_action:
    runs-on: ubuntu-latest
    needs:
      - hello_world_from_ubuntu_shel
      - hello_world_from_python_shell
    steps:
      - uses: actions/hello-world-javascript-action@ebdda30dcb464fa90dc49c837d7b5506f49932d0
        with:
          who-to-greet: "Sergio"
